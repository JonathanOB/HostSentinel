{% extends "base.html" %}
{% block title %}Login – HostSentinel{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="text-center mb-4">
      <i class="bi bi-shield-fill-check" style="font-size:3rem;color:var(--hs-green)"></i>
      <h3 class="fw-bold mt-2 mb-0">HostSentinel</h3>
      <p class="text-muted small">Intrusion Detection System</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label small text-muted">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label small text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-secondary">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" name="password" class="form-control" required>
        </div>
      </div>
      <button type="submit" class="btn btn-success w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
