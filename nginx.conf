# HostSentinel — nginx reverse proxy
# Place at: /etc/nginx/sites-available/hostsentinel
# Enable: ln -s /etc/nginx/sites-available/hostsentinel /etc/nginx/sites-enabled/
#
# Prerequisites:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com
#
# Replace YOUR_DOMAIN with your actual domain or server IP.

limit_req_zone $binary_remote_addr zone=hs_login:10m rate=5r/m;

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN"  always;
    add_header X-Content-Type-Options   "nosniff"     always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Restrict dashboard to your own IP(s) — strongly recommended
    # allow 1.2.3.4;
    # deny all;

    # Rate-limit login at the proxy level (in addition to app-level limiting)
    location /login {
        limit_req zone=hs_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    # SSE live feed — buffering MUST be off or the stream stalls
    location /stream {
        proxy_pass              http://127.0.0.1:5000;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        proxy_set_header        Connection '';
        proxy_http_version      1.1;
        chunked_transfer_encoding on;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }
}
